name: Verify Memoly Local
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Install the packaged CLI into a clean prefix
        shell: bash
        run: |
          package_file="$(npm pack --ignore-scripts --silent)"
          release_test_dir="$(mktemp -d)"
          npm install --global --prefix "$release_test_dir" --ignore-scripts "./$package_file"
          "$release_test_dir/bin/memoly" doctor
